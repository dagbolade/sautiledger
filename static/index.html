<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SautiLedger</title>
<style>
  /* Self-contained: no frameworks, no CDN assets — must work with wifi off. */
  :root {
    --bg: #0b1220;
    --panel: #121b2d;
    --panel-2: #1b2740;
    --line: #223052;
    --text: #e9eefc;
    --muted: #8b9bb8;
    --accent: #34d399;
    --accent-dim: rgba(52, 211, 153, 0.14);
    --warn: #fbbf24;
    --radius: 14px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    padding: var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));
    gap: var(--s3);
    font-size: 16px; line-height: 1.4;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  #total.bump { animation: totalBump 0.4s ease-out; }
  @keyframes totalBump {
    0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); }
  }
  #ledger h2 #total { display: inline-block; }

  /* ---- egress panel: calm, factual, tappable ---- */
  #egress {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--s3) var(--s4);
    display: flex; align-items: center; gap: var(--s3);
    cursor: pointer; transition: background 0.3s, border-color 0.3s;
  }
  #egress.zero { background: var(--accent-dim); border-color: rgba(52, 211, 153, 0.4); }
  #egress svg { flex: 0 0 22px; height: 22px; color: var(--muted); }
  #egress.zero svg { color: var(--accent); }
  #egress .body { flex: 1; min-width: 0; }
  #egress .label {
    font-size: 0.66rem; font-weight: 600; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
  }
  #egress .value {
    font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--warn);
  }
  #egress.zero .value { color: var(--accent); font-size: 0.98rem; }
  #mode {
    flex: 0 0 auto; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em;
    padding: 5px 11px; border-radius: 999px; border: 1px solid transparent;
  }
  #mode.offline { background: var(--accent-dim); color: var(--accent); border-color: rgba(52,211,153,0.35); }
  #mode.cloud { background: rgba(251, 191, 36, 0.12); color: var(--warn); border-color: rgba(251,191,36,0.3); }

  /* ---- chat ---- */
  #chat {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    gap: var(--s2); padding: var(--s1) 2px;
  }
  .bubble {
    max-width: 84%; padding: 10px 14px; border-radius: 16px;
    font-size: 1rem; line-height: 1.4;
    animation: bubbleIn 0.18s ease-out;
  }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(4px); } }
  .you {
    align-self: flex-end; background: var(--accent-dim);
    border: 1px solid rgba(52, 211, 153, 0.25);
    border-bottom-right-radius: 6px;
  }
  .sauti {
    align-self: flex-start; background: var(--panel);
    border: 1px solid var(--line); border-bottom-left-radius: 6px;
  }
  .sauti.question { border-color: var(--accent); }
  .sauti.status { color: var(--muted); font-style: italic; animation: shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }

  /* ---- ledger: the hero panel ---- */
  #ledger {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--s3) var(--s4);
  }
  #ledger h2 {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.66rem; font-weight: 600; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
    padding-bottom: var(--s2); border-bottom: 1px solid var(--line);
  }
  #ledger h2 #total {
    font-family: var(--font); font-size: 1.5rem; font-weight: 800;
    letter-spacing: 0; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #entries { list-style: none; margin-top: var(--s2); max-height: 21vh; overflow-y: auto; }
  #entries li {
    display: flex; align-items: center; gap: var(--s2);
    padding: 7px 0; font-size: 0.97rem;
    border-bottom: 1px solid rgba(34, 48, 82, 0.5);
  }
  #entries li:last-child { border-bottom: none; }
  #entries li.new { animation: rowIn 0.45s ease-out; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-6px); background: var(--accent-dim); }
    60% { background: var(--accent-dim); }
    to { opacity: 1; transform: none; background: transparent; }
  }
  #entries li .item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #entries li .chip {
    flex: 0 0 auto; font-size: 0.7rem; font-weight: 700; color: var(--muted);
    background: var(--panel-2); border-radius: 999px; padding: 2px 8px;
  }
  #entries li .credit {
    flex: 0 0 auto; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.05em;
    color: var(--warn);
  }
  #entries li .amt {
    flex: 0 0 auto; font-variant-numeric: tabular-nums; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  #entries li.expense .amt { color: var(--warn); }
  #entries li.voided { opacity: 0.38; }
  #entries li.voided .item, #entries li.voided .amt { text-decoration: line-through; }
  #entries li .del {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 0.8rem; padding: 2px 4px; line-height: 1;
  }
  #entries li .del:hover { color: var(--warn); }

  /* ---- controls: voice is the product ---- */
  #controls { display: flex; flex-direction: column; gap: var(--s2); align-items: center; }
  #talk {
    width: 118px; height: 118px; border-radius: 50%;
    border: 3px solid var(--accent); background: var(--panel);
    color: var(--accent); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px;
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none; position: relative;
    transition: transform 0.12s ease-out;
    animation: breathe 3.4s ease-in-out infinite;
  }
  #talk svg { width: 34px; height: 34px; pointer-events: none; }
  #talk span { pointer-events: none; }
  #talk:active { transform: scale(0.94); }
  #talk.recording {
    background: var(--accent); color: #06281c;
    animation: pulse 1.4s ease-out infinite;
  }
  /* idle: a slow breath so the eye finds the button without being nagged */
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    50% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0.09); }
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
    100% { box-shadow: 0 0 0 22px rgba(52, 211, 153, 0); }
  }
  #textbox { display: flex; gap: var(--s2); width: 100%; }
  #text {
    flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    /* 16px minimum or iOS zooms the whole page on focus */
    padding: 10px 12px; font-size: 16px; font-family: var(--font);
  }
  #text::placeholder { color: var(--muted); }
  #send {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 var(--s4); font-weight: 600;
    font-size: 0.9rem; cursor: pointer; font-family: var(--font);
  }

  /* ---- voice-clip retention consent: quiet but never hidden ---- */
  #consent {
    display: flex; align-items: center; gap: var(--s3);
    width: 100%; padding: var(--s3);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer;
    font-size: 0.8rem; color: var(--muted); line-height: 1.35;
    transition: border-color 0.25s, color 0.25s;
  }
  #consent .consent-text { flex: 1; }
  #consent.on { border-color: rgba(52, 211, 153, 0.45); color: var(--text); }
  #consent small { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
  #consent .switch {
    flex: 0 0 46px; height: 26px; border-radius: 999px; position: relative;
    background: var(--panel-2); border: 1px solid var(--line);
    transition: background 0.25s, border-color 0.25s;
  }
  #consent .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  #consent .knob {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
    border-radius: 50%; background: var(--muted); pointer-events: none;
    transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1), background 0.22s;
  }
  #consent.on .switch { background: var(--accent-dim); border-color: rgba(52, 211, 153, 0.45); }
  #consent.on .knob { transform: translateX(20px); background: var(--accent); }

  /* ---- egress ledger modal ---- */
  #modal {
    position: fixed; inset: 0; background: rgba(4, 8, 18, 0.94);
    display: flex; flex-direction: column; padding: var(--s4);
    max-width: 480px; margin: 0 auto;
    visibility: hidden; opacity: 0; transform: translateY(14px);
    transition: opacity 0.22s ease-out, transform 0.22s ease-out, visibility 0.22s;
  }
  #modal.open { visibility: visible; opacity: 1; transform: none; }
  #modal h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: var(--s1); }
  #modal p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: var(--s4); }
  #egress-rows { flex: 1; overflow-y: auto; }
  .erow {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: var(--s3); margin-bottom: var(--s2);
    font-size: 0.85rem;
  }
  .erow .top {
    display: flex; justify-content: space-between;
    color: var(--warn); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .erow .purpose { margin: var(--s1) 0; }
  .erow .disp { color: var(--muted); font-size: 0.76rem; }
  .empty {
    color: var(--accent); text-align: center; padding: 48px 0;
    font-size: 1.05rem; font-weight: 600;
  }
  #close {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: var(--s3); font-size: 1rem;
    font-weight: 600; cursor: pointer; font-family: var(--font);
  }
</style>
</head>
<body>
  <div id="egress" title="Tap to see every transmission">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>
    </svg>
    <div class="body">
      <div class="label">Data sent off this phone</div>
      <div class="value" id="egress-total">0.00 KB</div>
    </div>
    <div id="mode" class="offline">OFFLINE</div>
  </div>

  <div id="chat"></div>

  <div id="ledger">
    <h2>Today's ledger <span id="total">&#8358;0</span></h2>
    <ul id="entries"></ul>
  </div>

  <div id="controls">
    <button id="talk" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
      <span id="talk-label">HOLD TO TALK</span>
    </button>
    <div id="textbox">
      <input id="text" type="text" placeholder="or type am here…" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <label id="consent">
      <span class="consent-text">Keep my voice clips make dem help test the speech model.
      <small>Na only if you gree — you fit off am anytime. Clips stay for this app, nowhere else.</small></span>
      <span class="switch"><input type="checkbox" id="retain"><span class="knob"></span></span>
    </label>
  </div>

  <div id="modal">
    <h2>Transmission ledger</h2>
    <p class="sub">Every byte that ever left this device. Your money records are not on this list.</p>
    <div id="egress-rows"></div>
    <button id="close">Close</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
