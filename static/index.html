<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SautiLedger</title>
<style>
  /* Self-contained: no frameworks, no CDN assets — must work with wifi off.
     Warm-paper light theme: ink on cream, one deep money-green. Chosen for
     sunlight legibility — this app lives outdoors, in market stalls.
     Motion system: one spring for pops, one long ease for slides;
     everything respects prefers-reduced-motion. */
  :root {
    --bg: #f5f1e8;
    --card: #ffffff;
    --card-2: #fbf9f4;
    --line: #e5ded0;
    --ink: #1c2434;
    --muted: #77808f;
    --green: #0d9d64;
    --green-deep: #0a7a4e;
    --green-tint: #e3f5ec;
    --amber: #b7791f;
    --amber-tint: #fdf3e2;
    --r: 20px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px;
    --shadow: 0 10px 28px rgba(28, 36, 52, 0.09);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink); font-family: var(--font);
    display: flex; flex-direction: column;
    max-width: 480px; margin: 0 auto;
    padding: var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));
    gap: var(--s3);
    font-size: 16px; line-height: 1.4;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* staggered arrival: the page assembles itself, calm and quick */
  @keyframes enter {
    from { opacity: 0; transform: translateY(14px) scale(0.985); }
  }
  #topbar  { animation: enter 0.45s var(--ease) backwards; }
  #egress  { animation: enter 0.45s var(--ease) 0.05s backwards; }
  #ledger  { animation: enter 0.45s var(--ease) 0.10s backwards; }
  #controls{ animation: enter 0.45s var(--ease) 0.15s backwards; }

  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px var(--s1) 0;
  }
  #brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 1.05rem; font-weight: 800; letter-spacing: -0.01em;
  }
  #brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 4px var(--green-tint);
  }
  #mode {
    font-size: 0.64rem; font-weight: 800; letter-spacing: 0.08em;
    padding: 5px 12px; border-radius: 999px;
    transition: background 0.3s, color 0.3s;
  }
  #mode.offline { background: var(--green-tint); color: var(--green-deep); }
  #mode.cloud { background: var(--amber-tint); color: var(--amber); }

  /* ---- egress: a slim, factual strip — tap for the full ledger ---- */
  #egress {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px var(--s4);
    display: flex; align-items: center; gap: var(--s3);
    cursor: pointer; box-shadow: var(--shadow);
    transition: transform 0.15s var(--ease), background 0.3s, border-color 0.3s;
  }
  #egress:active { transform: scale(0.985); }
  #egress.zero { background: var(--green-tint); border-color: #bfe7d4; }
  #egress svg { flex: 0 0 20px; height: 20px; color: var(--muted); transition: color 0.3s; }
  #egress.zero svg { color: var(--green-deep); }
  #egress .body { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  #egress .label {
    font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase; white-space: nowrap;
  }
  #egress .value {
    font-size: 0.95rem; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--amber); transition: color 0.3s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #egress.zero .value { color: var(--green-deep); }
  #egress-total.flash { animation: egressFlash 0.7s var(--ease); }
  @keyframes egressFlash {
    0% { transform: scale(1.1); filter: brightness(0.7); }
    100% { transform: none; filter: none; }
  }

  /* ---- ledger: the hero — the money is the interface ---- */
  #ledger {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: var(--s4);
    box-shadow: var(--shadow);
  }
  #ledger h2 {
    display: flex; flex-direction: column; gap: 2px;
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase;
  }
  #ledger h2 #total {
    display: inline-block;
    font-size: 2.4rem; font-weight: 800; line-height: 1.1;
    letter-spacing: -0.03em; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  #total.bump { animation: totalBump 0.45s var(--spring); color: var(--green-deep); }
  @keyframes totalBump {
    0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); }
  }
  #entries { list-style: none; margin-top: var(--s3); max-height: 20vh; overflow-y: auto;
             border-top: 1px solid var(--line); }
  #entries li {
    display: flex; align-items: center; gap: var(--s2);
    padding: 9px 0; font-size: 0.97rem;
    border-bottom: 1px solid #f0ece2;
  }
  #entries li:last-child { border-bottom: none; }
  #entries li.new { animation: rowIn 0.5s var(--spring); }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-8px); background: var(--green-tint); }
    60% { background: var(--green-tint); }
    to { opacity: 1; transform: none; background: transparent; }
  }
  #entries li .item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; font-weight: 600; }
  #entries li .chip {
    flex: 0 0 auto; font-size: 0.7rem; font-weight: 700; color: var(--muted);
    background: var(--card-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 9px;
  }
  #entries li .credit {
    flex: 0 0 auto; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.05em;
    color: var(--amber);
  }
  #entries li .amt {
    flex: 0 0 auto; font-variant-numeric: tabular-nums; font-weight: 800;
    color: var(--green-deep);
    display: flex; align-items: center; gap: 6px;
  }
  #entries li.expense .amt { color: var(--amber); }
  #entries li.voided { opacity: 0.4; }
  #entries li.voided .item, #entries li.voided .amt { text-decoration: line-through; }
  #entries li .del {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 0.8rem; padding: 2px 4px; line-height: 1;
    transition: color 0.2s, transform 0.15s var(--spring);
  }
  #entries li .del:hover { color: var(--amber); transform: scale(1.25); }

  /* ---- chat ---- */
  #chat {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    gap: var(--s2); padding: var(--s1) 2px;
  }
  .bubble {
    max-width: 84%; padding: 10px 14px; border-radius: 18px;
    font-size: 1rem; line-height: 1.42;
    animation: bubblePop 0.3s var(--spring) backwards;
    transform-origin: bottom left;
  }
  @keyframes bubblePop {
    from { opacity: 0; transform: translateY(8px) scale(0.94); }
  }
  .you {
    align-self: flex-end; background: var(--green-tint);
    border: 1px solid #c8e9d8; color: var(--ink);
    border-bottom-right-radius: 7px; transform-origin: bottom right;
  }
  .sauti {
    align-self: flex-start; background: var(--card);
    border: 1px solid var(--line); box-shadow: 0 3px 10px rgba(28, 36, 52, 0.05);
    border-bottom-left-radius: 7px;
  }
  .sauti.question { border-color: var(--green); }
  .sauti.status { color: var(--muted); font-style: italic; box-shadow: none;
                  animation: shimmer 1.2s ease-in-out infinite; }
  @keyframes shimmer { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }

  /* ---- controls: voice is the product ---- */
  #controls { display: flex; flex-direction: column; gap: var(--s2); align-items: center; }
  #talk {
    width: 124px; height: 124px; border-radius: 50%;
    border: none;
    background: linear-gradient(180deg, var(--green), var(--green-deep));
    color: #ffffff; font-family: var(--font);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px;
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.07em;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    touch-action: none; position: relative;
    box-shadow: 0 14px 30px rgba(13, 157, 100, 0.35);
    transition: transform 0.18s var(--spring), box-shadow 0.25s;
    animation: breathe 3.6s ease-in-out infinite;
  }
  #talk svg { width: 38px; height: 38px; pointer-events: none; }
  #talk span { pointer-events: none; }
  #talk:active { transform: scale(0.92); }
  #talk.recording {
    background: linear-gradient(180deg, #12b876, var(--green));
    animation: none;
    box-shadow: 0 6px 18px rgba(13, 157, 100, 0.45);
  }
  /* recording: two rings ripple outward — unmistakable "it dey hear you" */
  #talk::before, #talk::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid var(--green); opacity: 0; pointer-events: none;
  }
  #talk.recording::before { animation: ring 1.5s ease-out infinite; }
  #talk.recording::after { animation: ring 1.5s ease-out 0.75s infinite; }
  @keyframes ring {
    from { transform: scale(1); opacity: 0.6; }
    to { transform: scale(1.6); opacity: 0; }
  }
  /* idle: a slow breath so the eye finds the button without being nagged */
  @keyframes breathe {
    0%, 100% { box-shadow: 0 14px 30px rgba(13, 157, 100, 0.35); }
    50% { box-shadow: 0 14px 38px rgba(13, 157, 100, 0.5); }
  }

  #textbox { display: flex; gap: var(--s2); width: 100%; }
  #text {
    flex: 1; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 13px;
    /* 16px minimum or iOS zooms the whole page on focus */
    padding: 11px 14px; font-size: 16px; font-family: var(--font);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #text:focus {
    outline: none; border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-tint);
  }
  #text::placeholder { color: var(--muted); }
  #send {
    background: var(--ink); color: #ffffff; border: none;
    border-radius: 13px; padding: 0 var(--s5); font-weight: 700;
    font-size: 0.9rem; cursor: pointer; font-family: var(--font);
    transition: transform 0.15s var(--spring), opacity 0.2s;
  }
  #send:active { transform: scale(0.93); }

  /* ---- voice-clip retention consent: quiet but never hidden ---- */
  #consent {
    display: flex; align-items: center; gap: var(--s3);
    width: 100%; padding: var(--s3);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 13px; cursor: pointer;
    font-size: 0.8rem; color: var(--muted); line-height: 1.35;
    transition: border-color 0.25s, color 0.25s;
  }
  #consent .consent-text { flex: 1; }
  #consent.on { border-color: var(--green); color: var(--ink); }
  #consent small { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
  #consent .switch {
    flex: 0 0 46px; height: 26px; border-radius: 999px; position: relative;
    background: var(--line);
    transition: background 0.25s;
  }
  #consent .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  #consent .knob {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #ffffff; pointer-events: none;
    box-shadow: 0 1px 4px rgba(28, 36, 52, 0.3);
    transition: transform 0.25s var(--spring);
  }
  #consent.on .switch { background: var(--green); }
  #consent.on .knob { transform: translateX(20px); }

  /* ---- transmission ledger: bottom sheet ---- */
  #modal {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(28, 36, 52, 0); backdrop-filter: blur(0px);
    visibility: hidden;
    transition: background 0.28s, backdrop-filter 0.28s, visibility 0.28s;
  }
  #modal.open { visibility: visible; background: rgba(28, 36, 52, 0.4); backdrop-filter: blur(5px); }
  #modal .sheet {
    width: 100%; max-width: 480px; max-height: 82vh;
    display: flex; flex-direction: column;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    padding: 10px var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.34s var(--ease);
    box-shadow: 0 -12px 40px rgba(28, 36, 52, 0.25);
  }
  #modal.open .sheet { transform: none; }
  .grab {
    width: 44px; height: 5px; border-radius: 999px;
    background: var(--line); margin: 0 auto var(--s3);
  }
  #modal h2 { font-size: 1.12rem; font-weight: 800; margin-bottom: var(--s1); }
  #modal p.sub { color: var(--muted); font-size: 0.85rem; margin-bottom: var(--s3); }
  #egress-rows { flex: 1; overflow-y: auto; min-height: 80px; }
  .erow {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 13px; padding: var(--s3); margin-bottom: var(--s2);
    font-size: 0.85rem;
  }
  .erow .top {
    display: flex; justify-content: space-between;
    color: var(--amber); font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .erow .purpose { margin: var(--s1) 0; }
  .erow .disp { color: var(--muted); font-size: 0.76rem; }
  .empty {
    color: var(--green-deep); text-align: center; padding: 40px 0;
    font-size: 1.05rem; font-weight: 700;
  }
  #close {
    background: var(--ink); color: #ffffff; border: none;
    border-radius: 13px; padding: var(--s3); font-size: 1rem;
    font-weight: 700; cursor: pointer; font-family: var(--font);
    margin-top: var(--s2);
    transition: transform 0.15s var(--spring);
  }
  #close:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div id="topbar">
    <div id="brand"><span class="dot"></span>SautiLedger</div>
    <div id="mode" class="offline">OFFLINE</div>
  </div>

  <div id="egress" title="Tap to see every transmission">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/>
    </svg>
    <div class="body">
      <div class="label">Sent off this phone</div>
      <div class="value" id="egress-total">0.00 KB</div>
    </div>
  </div>

  <div id="ledger">
    <h2>Today's ledger <span id="total">&#8358;0</span></h2>
    <ul id="entries"></ul>
  </div>

  <div id="chat"></div>

  <div id="controls">
    <button id="talk" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v1a7 7 0 0 0 14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
      <span id="talk-label">HOLD TO TALK</span>
    </button>
    <div id="textbox">
      <input id="text" type="text" placeholder="or type am here…" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <label id="consent">
      <span class="consent-text">Keep my voice clips make dem help test the speech model.
      <small>Na only if you gree — you fit off am anytime. Clips stay for this app, nowhere else.</small></span>
      <span class="switch"><input type="checkbox" id="retain"><span class="knob"></span></span>
    </label>
  </div>

  <div id="modal">
    <div class="sheet">
      <div class="grab"></div>
      <h2>Transmission ledger</h2>
      <p class="sub">Every byte that ever left this device. Your money records are not on this list.</p>
      <div id="egress-rows"></div>
      <button id="close">Close</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
