[project]
name = "sautiledger"
version = "1.0.0"
description = "Offline-first, code-switched voice ledger for African market traders"
authors = [{ name = "David Agbolade" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "certifi>=2024.0",
    "av>=12.0",
    "numpy>=1.26",  # av frame -> bytes without plane padding (audio.py)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: runs against the real local Ollama model (make test-live)"]
